<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Half Pipe Demo</title>
  <script src="https://cjrtnc.leaningtech.com/2.3/loader.js"></script>
  <script>
    async function launch() {
      await cheerpjInit();
      const res = await fetch("HalfPipeGame.jar.base64");
      const b64 = await res.text();
      await cheerpjCreateFile("/app/HalfPipeGame.jar", b64, "base64");
      await cheerpjRunJar("/app/HalfPipeGame.jar");
    }

    window.addEventListener('keydown', async function handler(e) {
      if (e.code === 'Space') {
        window.removeEventListener('keydown', handler);
        const overlay = document.getElementById('start-overlay');
        if (overlay) overlay.remove();
        await launch();
      }
    });
  </script>
  <style>
    html, body, canvas {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: black;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="start-overlay">Press Space to Start</div>
  <canvas id="canvas"></canvas>
</body>
</html>
