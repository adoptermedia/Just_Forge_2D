<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Half Pipe Demo</title>
  <script src="https://cjrtnc.leaningtech.com/2.3/cheerpj.js"></script>
    <script>
      async function launch() {
        await cheerpjInit();
        const res = await fetch("HalfPipeGame.jar.base64");
        const b64 = await res.text();
        await cheerpjCreateFile("/app/HalfPipeGame.jar", b64, "base64");
        await cheerpjRunJar("/app/HalfPipeGame.jar");
      }
    </script>
  <style>
    html, body, canvas {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body onload="launch()">
  <canvas id="canvas"></canvas>
</body>
</html>
